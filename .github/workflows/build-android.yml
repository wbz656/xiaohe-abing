name: Build Android ARMv7

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.3)'
        required: true
        default: '1.1.3'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 创建打包目录并下载官方 Android ARMv7 核心
      - name: Fetch official Aether core (Android ARMv7)
        run: |
          mkdir -p dist
          curl -L -o core.tar.gz https://github.com/CluvexStudio/Aether/releases/download/v2.1.0/aether-android-armv7.tar.gz
          tar -xzf core.tar.gz -C dist/
          chmod +x dist/* || true

      # 2. 把你仓库里自带的其他文件（如有）复制进打包目录
      - name: Copy repository files
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'dist' -exec cp -r {} dist/ \; || true

      # 3. 打包成 tar.gz 文件
      - name: Package Android build
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="1.1.3"; fi
          tar -czvf android-armv7-v$VERSION.tar.gz -C dist .

      # 4. 上传到 GitHub Actions 产物中
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7-v${{ github.event.inputs.version || '1.1.3' }}
          path: android-armv7-v*.tar.gz
